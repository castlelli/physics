[project]
name = "momentfield"
version = "2.0.0"
description = "PME3100 - Campo de momentos de uma força: axissimetria em torno da linha de ação, figuras e relatório em PDF"
requires-python = ">=3.10"
dependencies = ["numpy", "matplotlib", "jinja2"]

[project.optional-dependencies]
teste = ["pytest"]

[tool.setuptools]
packages = ["codigo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
